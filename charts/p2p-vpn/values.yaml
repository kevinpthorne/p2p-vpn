# Default values for p2p-vpn.

replicaCount: 1

image:
  repository: ghcr.io/kevinpthorne/p2p-vpn
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# VPN Configuration Mode: 'endpoint' or 'relay'
mode: endpoint

# Common parameters
cluster: "my-k8s-cluster"
port: 4001
dryRun: false

# Mode-specific parameters
# For endpoint mode:
relayMultiaddrs: "" # Can be a string or a list of strings
tunIp: ""       # e.g., "10.200.0.1/24"
extDns: ""      # e.g., "relay.example.org"
advertise: ""   # e.g., "10.100.1.0/24"

# Secret configurations
# You can define them here to let the chart generate a Kubernetes Secret,
# or specify an existingSecret to reference.
secrets:
  # Whether the chart should create a Secret containing your credentials.
  create: false

  # Hex data key (32 bytes) for payload encryption
  dataKey: ""

  # Node private identity key (libp2p key)
  identityKey: ""

  # CA Public Key (PEM format) for post-quantum PKI verification
  caPubKey: ""

  # CA Signature (PEM format) for this node's identity
  nodeSig: ""

  # Allowed Peer IDs whitelist (one per line)
  allowedPeers: ""

# Name of an existing Secret containing keys.
# The keys in the Secret should match:
# - data.key
# - identity.key
# - ca.pub
# - node.sig
# - whitelist.txt
existingSecret: ""

# Pod Security Context. Endpoints require root/NET_ADMIN to create TUN devices.
securityContext:
  privileged: true
  # capabilities:
  #   add:
  #     - NET_ADMIN

# Node Selector/Tolerations/Affinity
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Host volume for TUN device (required for endpoint mode if not in dry-run)
tunVolume:
  hostPath: /dev/net/tun
